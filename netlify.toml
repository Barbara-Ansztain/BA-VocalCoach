[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # EMAIL_FROM es un mail público (aparece en cada correo), no un secreto.
  # Si está marcado "Secret" en Netlify, el scanner lo encuentra en el bundle y mata el deploy.
  SECRETS_SCAN_OMIT_KEYS = "EMAIL_FROM"
